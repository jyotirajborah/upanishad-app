name: Setup Release Keystore

on:
  workflow_dispatch:

jobs:
  create-keystore:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Release Keystore
        run: |
          keytool -genkey -v -keystore upanishad-release.keystore \
            -alias upanishad \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass upanishad2025 \
            -keypass upanishad2025 \
            -dname "CN=Upanishad Gyanamrit, OU=App, O=Upanishad, L=India, S=India, C=IN"
      
      - name: Upload Keystore
        uses: actions/upload-artifact@v4
        with:
          name: release-keystore
          path: upanishad-release.keystore
